<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Dice al telefono di usare la larghezza reale dello schermo (senza questo, su mobile tutto apparirebbe minuscolo) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Colore della barra del browser su Android: lo stesso dello sfondo, così l'app sembra "a tutto schermo" -->
  <meta name="theme-color" content="#121626">
  <title>app-coppia</title>

  <!-- PWA: il "biglietto da visita" dell'app (nome, icone, colori) per installarla sul telefono -->
  <link rel="manifest" href="manifest.json">
  <!-- Icona della scheda del browser -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- Icona usata da iPhone/iPad se un giorno la aggiungete alla schermata Home -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--
    L'app è una sola pagina con più "schermate".
    Ogni schermata è una <section> con la classe "screen".
    In ogni momento solo UNA è visibile: quella con la classe "screen--active".
    Il cambio di schermata lo fa la funzione showScreen() in js/script.js.
  -->

  <!-- SCHERMATA 1: Home -->
  <section id="screenHome" class="screen screen--active">
    <h1 class="appTitle">app-coppia</h1>
    <p class="subtitle">Un gioco per ritrovarsi</p>
    <!-- Messaggio sullo stato delle carte: lo scrive il JavaScript dopo il caricamento -->
    <p id="deckStatus" class="deckStatus">Sto preparando le carte…</p>
    <!-- A che punto del viaggio siete: lo scrive il JavaScript -->
    <p id="journeyStatus" class="deckStatus"></p>

    <div class="buttonGroup">
      <!-- data-target dice a quale schermata porta il pulsante -->
      <button class="button button--primary" data-target="screenSetup">Nuova serata</button>
      <button id="buttonOpenSkipped" class="button">In sospeso</button>
      <button id="buttonOpenFavorites" class="button">Preferite</button>
    </div>

    <button id="buttonEraseData" class="button button--ghost button--small">Ricomincia da zero</button>
  </section>

  <!-- SCHERMATA 2: Scelta dei colori -->
  <section id="screenSetup" class="screen">
    <h2>Scegliete i vostri colori</h2>

    <!-- I pallini colorati vengono creati dal JavaScript (funzione renderColorPickers in script.js) -->
    <div class="colorPicker">
      <p class="colorPickerLabel">Tu</p>
      <div id="colorPickerFirst" class="swatchRow"></div>
      <p id="chosenColorFirst" class="chosenColorName">Scegli un colore</p>
    </div>

    <div class="colorPicker">
      <p class="colorPickerLabel">L'altra persona</p>
      <div id="colorPickerSecond" class="swatchRow"></div>
      <p id="chosenColorSecond" class="chosenColorName">Scegli un colore</p>
    </div>

    <div class="buttonGroup">
      <!-- "disabled": il pulsante non si può premere finché non avete scelto entrambi -->
      <button id="buttonStartEvening" class="button button--primary" disabled>Iniziamo</button>
      <button class="button button--ghost" data-target="screenHome">Indietro</button>
    </div>
  </section>

  <!-- SCHERMATA 3: Gioco -->
  <section id="screenGame" class="screen">
    <!-- La carta: i testi vengono riempiti dalla funzione renderCard() in js/ui.js -->
    <article id="card" class="card">
      <div class="cardHeader">
        <p id="cardLevel" class="cardLevel"></p>
        <p id="cardIntensity" class="cardIntensity"></p>
      </div>
      <p id="cardText" class="cardText"></p>
      <p id="cardMode" class="cardMode"></p>

      <!-- I due cuori: uno per giocatore, ognuno nel proprio colore -->
      <div id="cardHearts" class="cardHearts">
        <button id="heartFirst" class="heartButton" aria-label="Preferita (primo colore)"></button>
        <button id="heartSecond" class="heartButton" aria-label="Preferita (secondo colore)"></button>
      </div>

      <!-- Copertura delle carte intense (●●●): si vede solo quando la carta ha la classe "card--covered" -->
      <div class="cardCover">
        <p class="cardCoverIntensity">●●●</p>
        <p class="cardCoverTitle">Carta intensa</p>
        <p class="cardCoverText">Siete pronti a scoprirla?</p>
        <div class="buttonGroup">
          <button id="buttonRevealCard" class="button button--primary">Scopri</button>
          <button id="buttonSkipCovered" class="button button--ghost">Mettila in sospeso</button>
        </div>
      </div>
    </article>

    <!-- I pulsanti di gioco: nascosti mentre una carta intensa è ancora coperta -->
    <div id="gameActions" class="buttonGroup buttonGroup--row">
      <button id="buttonSkipCard" class="button button--ghost">Metti in sospeso</button>
      <button id="buttonNextTurn" class="button button--primary">Fatto, passa</button>
    </div>

    <!-- Pulsanti secondari: scendere di livello quando ci si sente pronti, o chiudere la serata -->
    <div class="buttonGroup buttonGroup--row">
      <button id="buttonGoDeeper" class="button button--ghost">Più a fondo ↓</button>
      <button id="buttonCloseEvening" class="button button--ghost">Chiudi la serata</button>
    </div>
  </section>

  <!--
    SCHERMATA DEI MESSAGGI
    Una sola schermata riutilizzata per tutti i momenti "di pausa":
    "volete andare più a fondo?", "per stasera può bastare", "regole del cuore".
    Titolo, testo e pulsanti li riempie la funzione showPrompt() in js/ui.js.
    I pulsanti vengono creati dal JavaScript (possono essere 1, 2 o 3).
  -->
  <section id="screenPrompt" class="screen">
    <h2 id="promptTitle"></h2>
    <p id="promptText" class="promptText"></p>
    <div id="promptButtons" class="buttonGroup"></div>
  </section>

  <!-- SCHERMATA 4: Domande in sospeso -->
  <section id="screenSkipped" class="screen screen--list">
    <h2>In sospeso</h2>
    <p class="listIntro">Le domande che avete messo da parte. Riapritele quando vi sentite pronti.</p>
    <!-- L'elenco viene creato dal JavaScript (renderSkippedList in ui.js) -->
    <div id="skippedList" class="cardList"></div>
    <button class="button button--ghost" data-target="screenHome">Indietro</button>
  </section>

  <!-- SCHERMATA 5: Preferite -->
  <section id="screenFavorites" class="screen screen--list">
    <h2>Preferite</h2>
    <!-- I filtri: i cuori di un colore, dell'altro, o di entrambi -->
    <div class="filterRow">
      <button id="filterFirst" class="filterButton" data-filter="first"></button>
      <button id="filterSecond" class="filterButton" data-filter="second"></button>
      <button id="filterBoth" class="filterButton" data-filter="both">Entrambi</button>
    </div>
    <div id="favoritesList" class="cardList"></div>
    <button class="button button--ghost" data-target="screenHome">Indietro</button>
  </section>

  <!--
    "defer" vuol dire: carica lo script, ma eseguilo solo quando tutta la pagina HTML è pronta.
    Così quando il JavaScript cerca i pulsanti, i pulsanti esistono già.
  -->
  <!-- L'ordine conta: prima gameEngine.js (le carte e le regole),
       poi storage.js (il salvataggio), ui.js (come si disegnano),
       infine script.js (che usa tutti gli altri).
       Con "defer" vengono eseguiti esattamente in questo ordine. -->
  <script src="js/gameEngine.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
